name: tessie_app
description: A modern Flutter app to interact with the Tessie API for Tesla vehicle control
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2

  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0

  # Charts
  fl_chart: ^0.66.0

  # Utils
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4

  # Biometric & Face Recognition
  local_auth: ^2.1.8
  local_auth_android: ^1.0.35
  local_auth_ios: ^1.1.5
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - .env
